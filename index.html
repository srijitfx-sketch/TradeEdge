<html><head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#e8e8f0;font-family:Poppins,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
.hdr{background:linear-gradient(135deg,#0a0a14,#0e0e1c);padding:12px 16px;border-bottom:1px solid rgba(150,150,150,0.1);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
.logo{font-size:17px;font-weight:700;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,#ccc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo b{background:linear-gradient(90deg,#FFD700,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.badge{background:linear-gradient(135deg,#FFD700,#cc8800);color:#000;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
.hbtn{background:none;border:none;cursor:pointer;font-size:22px;padding:2px 6px;color:#aaa;line-height:1;}
.pg{padding:12px;display:none;}
.pg.on{display:block;}
.card{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.12);border-radius:16px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;}
.tl{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(180,180,180,0.2),transparent);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sc{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.12);border-radius:14px;padding:12px;}
.mbar{background:#0a0a0a;border-radius:20px;height:7px;overflow:hidden;margin-top:5px;}
.mfill{height:100%;border-radius:20px;transition:width .5s;}
input,select,textarea{background:#0a0a0a;border:1px solid rgba(150,150,150,0.2);border-radius:10px;padding:11px 13px;color:#e8e8f0;font-size:14px;font-family:Poppins,sans-serif;width:100%;outline:none;display:block;margin-bottom:0;}
textarea{resize:none;line-height:1.5;}
label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:5px;display:block;margin-top:10px;}
label:first-child{margin-top:0;}
.btn{border:none;border-radius:11px;padding:12px 16px;color:#fff;font-family:Poppins,sans-serif;font-weight:700;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#4169E1,#6A0DAD);width:100%;display:block;margin-top:10px;}
.btn-g{background:linear-gradient(135deg,#161616,#1a1a1a);color:#777;border:1px solid rgba(150,150,150,0.15);}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:7px;width:auto;display:inline-block;margin-top:0;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#000;border-top:1px solid rgba(150,150,150,0.1);padding:8px 0 18px;z-index:50;display:flex;justify-content:space-around;}
.nb{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;opacity:.4;transition:all .2s;font-family:Poppins,sans-serif;}
.nb.on{opacity:1;}
.nb .ni{font-size:22px;}
.nb .nl{font-size:9px;color:#555;font-weight:500;}
.nb.on .nl{color:#fff;font-weight:700;}
.nd{width:16px;height:2px;background:linear-gradient(90deg,#4169E1,#6A0DAD);border-radius:1px;display:none;}
.nb.on .nd{display:block;}
.sbbg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:60;display:none;}
.sb{position:fixed;top:0;left:-290px;width:280px;height:100%;background:#0d0d1a;z-index:61;transition:left .25s;overflow-y:auto;padding-bottom:30px;border-right:1px solid rgba(150,150,150,0.1);}
.sb.open{left:0;}
.sbh{padding:20px 18px 16px;border-bottom:1px solid rgba(150,150,150,0.08);}
.sbl{font-size:20px;font-weight:700;background:linear-gradient(90deg,#fff,#ccc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sbl b{background:linear-gradient(90deg,#FFD700,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sbsec{padding:12px 16px 4px;font-size:10px;color:#333;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
.sbi{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:Poppins,sans-serif;transition:background .15s;}
.sbi:hover,.sbi.on{background:rgba(65,105,225,0.1);}
.sbi.on{border-left:3px solid #4169E1;}
.sbi .ic{font-size:18px;width:24px;text-align:center;}
.sbi .lb{font-size:13px;color:#777;font-weight:500;}
.sbi.on .lb{color:#fff;font-weight:700;}
.sdiv{height:1px;background:rgba(150,150,150,0.07);margin:6px 0;}
.bars{display:flex;align-items:flex-end;gap:6px;height:75px;margin-top:8px;}
.bc{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;}
.br{width:100%;border-radius:4px 4px 0 0;min-height:3px;}
.bl{font-size:9px;color:#444;}
.chat{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:4px 0;}
.bub{max-width:88%;padding:9px 13px;font-size:13px;line-height:1.6;color:#ddd;white-space:pre-wrap;border-radius:12px;}
.bub.u{background:linear-gradient(135deg,#4169E1,#6A0DAD);align-self:flex-end;border-radius:14px 14px 4px 14px;}
.bub.a{background:#161616;border:1px solid rgba(150,150,150,0.1);align-self:flex-start;border-radius:14px 14px 14px 4px;}
.crow{display:flex;gap:8px;align-items:center;}
.crow input{flex:1;margin-bottom:0;}
.fsbtn{background:rgba(65,105,225,0.12);border:1px solid rgba(65,105,225,0.25);border-radius:8px;color:#7a9fff;font-size:13px;padding:5px 9px;cursor:pointer;font-weight:700;line-height:1;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.alert{border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:12px;font-weight:600;}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(150,150,150,0.05);}
.row:last-child{border-bottom:none;}
</style>
</head>
<body>

  <button class="nb on" id="nb0" onclick="go(0)"><span class="ni">&#127968;</span><span class="nl">Home</span><div class="nd"></div></button>
  <button class="nb" id="nb1" onclick="go(1)"><span class="ni">&#128210;</span><span class="nl">Log</span><div class="nd"></div></button>
  <button class="nb" id="nb4" onclick="go(4)"><span class="ni">&#128202;</span><span class="nl">Stats</span><div class="nd"></div></button>
</div>

<script>
var LOTS=[{s:8,l:7,r:112,c:"tight"},{s:10,l:6,r:120,c:"tight"},{s:12,l:5,r:120,c:"normal"},{s:15,l:4,r:120,c:"normal"},{s:20,l:3,r:120,c:"normal"},{s:30,l:2,r:120,c:"wide"},{s:60,l:1,r:120,c:"wide"}];
var MGCL=[{s:1,l:12,r:120,c:"scalp"},{s:2,l:6,r:120,c:"scalp"},{s:3,l:4,r:120,c:"tight"},{s:4,l:3,r:120,c:"tight"},{s:5,l:2,r:100,c:"normal"},{s:6,l:2,r:120,c:"normal"},{s:8,l:1,r:80,c:"wide"},{s:10,l:1,r:100,c:"wide"},{s:12,l:1,r:120,c:"wide"}];
var CC={scalp:"#ff69b4",tight:"#9b59f5",normal:"#00e676",wide:"#ff9800"};
var QQ=["The goal of a successful trader is to make the best trades.","Plan the trade, trade the plan. Always.","Discipline is the bridge between goals and accomplishment.","The market rewards patience and punishes impulse.","Risk management is taking calculated risks."];

var trades=JSON.parse(localStorage.getItem("te_trades")||"null")||[
  {id:1,date:"2026-05-19",dir:"Long",strat:"SMC",stop:10,lots:6,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"Clean demand zone BOS"},
  {id:2,date:"2026-05-20",dir:"Short",strat:"EMA+ST",stop:15,lots:4,pnl:-120,stars:3,sess:"London",emo:"Hesitant",notes:"Moved SL too early"},
  {id:3,date:"2026-05-21",dir:"Long",strat:"Both",stop:12,lots:5,pnl:180,stars:5,sess:"NY",emo:"Confident",notes:"Perfect confluence"},
  {id:4,date:"2026-05-22",dir:"Long",strat:"SMC",stop:8,lots:7,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"A+ demand zone"}
];
var props=JSON.parse(localStorage.getItem("te_props")||"[]");
var notes=JSON.parse(localStorage.getItem("te_notes")||"[]");
var psych=JSON.parse(localStorage.getItem("te_psych")||"[]");
var chatH=[];
var starV=5;
var mgc=false;
var curP=0;

function svT(){localStorage.setItem("te_trades",JSON.stringify(trades));}
function svP(){localStorage.setItem("te_props",JSON.stringify(props));}
function svN(){localStorage.setItem("te_notes",JSON.stringify(notes));}
function svPs(){localStorage.setItem("te_psych",JSON.stringify(psych));}

function openSB(){document.getElementById("sb").classList.add("open");document.getElementById("sbbg").style.display="block";}
function closeSB(){document.getElementById("sb").classList.remove("open");document.getElementById("sbbg").style.display="none";}

function cL(s,m){
  if(!s||s<=0)return null;
  var mx=m?12:60;if(s>mx)return null;
  var l=Math.floor(mx/s);if(l<1)return null;
  var r=Math.round(l*s*(m?10:2));
  var tb=m?MGCL:LOTS,n=tb[0];
  for(var i=0;i<tb.length;i++)if(Math.abs(tb[i].s-s)<Math.abs(n.s-s))n=tb[i];
  return{l:l,r:r,c:n.c};
}
function gLv(n){
  if(n<10)return{n:10,lb:"Rookie"};if(n<25)return{n:25,lb:"Apprentice"};
  if(n<50)return{n:50,lb:"Trader"};if(n<75)return{n:75,lb:"Expert"};
  if(n<100)return{n:100,lb:"Master"};return{n:100,lb:"Legend"};
}
function gSt(){
  var td=new Date().toISOString().split("T")[0],dP=0,wP=0;
  var ws=new Date();ws.setDate(ws.getDate()-ws.getDay());
  var tw=0,tl=0,wins=[],loss=[];
  for(var i=0;i<trades.length;i++){
    var t=trades[i];
    if(t.date===td){dP+=t.pnl;if(t.pnl>0)tw++;else tl++;}
    if(new Date(t.date)>=ws)wP+=t.pnl;
    if(t.pnl>0)wins.push(t);else loss.push(t);
  }
  var wr=trades.length?Math.round(wins.length/trades.length*100):0;
  var aW=0,aL=1;
  if(wins.length){var s=0;for(var i=0;i<wins.length;i++)s+=wins[i].pnl;aW=Math.round(s/wins.length);}
  if(loss.length){var s=0;for(var i=0;i<loss.length;i++)s+=loss[i].pnl;aL=Math.round(Math.abs(s/loss.length));}
  var rr=(aL>0)?(aW/aL).toFixed(1):"--";
  return{dP:dP,wP:wP,wr:wr,aW:aW,aL:aL,rr:rr,tw:tw,tl:tl};
}
function mt(p,f){return '<div class="mbar"><div class="mfill" style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+f+'"></div></div>';}
function pc(v){return v>=0?"#00e676":"#ff1744";}
function fm(v){return (v>=0?"+$":"-$")+Math.abs(v);}
function el(id){return document.getElementById(id);}

function renderHome(){
  var st=gSt(),lv=gLv(trades.length);
  var lp=Math.min(100,trades.length/lv.n*100);
  var h=new Date().getHours(),gr=h<12?"Morning":h<17?"Afternoon":"Evening";
  var ac,ab,abr,am;
  if(st.dP<=-360){ac="#ff1744";ab="rgba(255,23,68,0.08)";abr="rgba(255,23,68,0.25)";am="Stop! Daily loss limit hit.";}
  else if(st.dP>=540){ac="#00e676";ab="rgba(0,230,118,0.06)";abr="rgba(0,230,118,0.2)";am="Target hit! Consider stopping.";}
  else{ac="#4169E1";ab="rgba(65,105,225,0.06)";abr="rgba(65,105,225,0.2)";am="Stay disciplined. Follow your rules.";}
  var bp=[-120,240,180,240,st.dP],bd=["Mon","Tue","Wed","Thu","Fri"],mx=1;
  for(var i=0;i<bp.length;i++)if(Math.abs(bp[i])>mx)mx=Math.abs(bp[i]);
  var bh="";
  for(var i=0;i<bp.length;i++){
    var h2=Math.max(4,Math.round(Math.abs(bp[i])/mx*65));
    bh+='<div class="bc"><div class="br" style="height:'+h2+'px;background:'+(bp[i]>=0?"#00e676":"#ff1744")+'"></div><div class="bl">'+bd[i]+'</div></div>';
  }
  var sc=[["Weekly P&L",fm(st.wP),pc(st.wP),"Target $1,600"],["Win Rate",st.wr+"%","#FFD700",trades.length+" trades"],["Risk:Reward","1:"+st.rr,"#00e5ff","Target 1:2"],["Avg Win","$"+st.aW,"#00e676","Avg loss $"+st.aL]];
  var sh="";for(var i=0;i<sc.length;i++)sh+='<div class="sc"><div style="font-size:10px;color:#555;margin-bottom:3px">'+sc[i][0]+'</div><div style="font-size:19px;font-weight:700;color:'+sc[i][2]+'">'+sc[i][1]+'</div><div style="font-size:10px;color:#333;margin-top:2px">'+sc[i][3]+'</div></div>';
  var ms=[["Daily Loss",Math.abs(Math.min(0,st.dP)),360,"linear-gradient(90deg,#ff1744,#8b0000)","#ff1744"],["Daily Profit",Math.max(0,st.dP),540,"linear-gradient(90deg,#FFD700,#cc8800)","#00e676"],["Weekly Loss",Math.abs(Math.min(0,st.wP)),1200,"linear-gradient(90deg,#6A0DAD,#4169E1)","#ff1744"],["Weekly Profit",Math.max(0,st.wP),1600,"linear-gradient(90deg,#FFD700,#cc8800)","#00e676"]];
  var mh="";
  for(var i=0;i<ms.length;i++){
    mh+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#666">'+ms[i][0]+'</span><span style="color:'+ms[i][4]+';font-weight:700">$'+ms[i][1]+' / $'+ms[i][2]+'</span></div>'+mt(ms[i][1]/ms[i][2]*100,ms[i][3])+'</div>';
  }
  el("p0").innerHTML=
    '<div class="card" style="background:linear-gradient(145deg,#0a0a1a,#111122);border-color:rgba(65,105,225,0.2)"><div class="tl"></div>'+
    '<div style="font-size:11px;color:#555;margin-bottom:3px">Good '+gr+', <b style="color:#fff">Srijit</b></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="font-size:10px;color:#444;text-transform:uppercase;letter-spacing:1px">Today P&amp;L</div>'+
    '<div style="font-size:32px;font-weight:700;color:'+pc(st.dP)+'">'+fm(st.dP)+'</div>'+
    '<div style="font-size:11px;color:#444">'+st.tw+'W &middot; '+st.tl+'L today</div></div>'+
    '<div style="text-align:center;padding:10px"><div style="font-size:10px;color:#FFD700;font-weight:700">'+lv.lb+'</div>'+
    '<div style="font-size:10px;color:#333">'+trades.length+' trades</div></div></div>'+
    mt(lp,"linear-gradient(90deg,#FFD700,#cc8800)")+
    '<div style="font-size:10px;color:#333;margin-top:4px;text-align:right">'+(lv.n>trades.length?(lv.n-trades.length)+" to next level":"Legend!")+'</div></div>'+
    '<div class="alert" style="color:'+ac+';background:'+ab+';border:1px solid '+abr+'">'+am+'</div>'+
    '<div class="g2" style="margin-bottom:12px">'+sh+'</div>'+
    '<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#FFD700;margin-bottom:10px">Risk Meters</div>'+mh+'</div>'+
    '<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#555;margin-bottom:6px">This Week</div><div class="bars">'+bh+'</div></div>'+
    '<div class="card" style="border-left:3px solid #4169E1"><div style="font-size:10px;color:#4169E1;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">Daily Quote</div>'+
    '<div style="font-size:12px;color:#555;font-style:italic;line-height:1.6">"'+QQ[new Date().getDay()%QQ.length]+'"</div></div>';
  el("lvlbadge").textContent=lv.lb;
  el("sb-lvl").textContent=lv.lb;
}

function renderLog(){
  var st=gSt(),list="";
  for(var i=trades.length-1;i>=0;i--){
    var t=trades[i];
    var dc=t.dir==="Long"?"#00e676":"#ff1744";
    var sc2=t.strat==="Both"?"#FFD700":t.strat==="SMC"?"#8aacff":"#c084fc";
    var sb=t.strat==="Both"?"rgba(255,215,0,.1)":t.strat==="SMC"?"rgba(65,105,225,.1)":"rgba(106,13,173,.1)";
    var st2="";for(var s=0;s<t.stars;s++)st2+="*";
    list+='<div style="background:#111;border:1px solid rgba(150,150,150,0.1);border-left:3px solid '+pc(t.pnl)+';border-radius:14px;padding:13px;margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between">'+
      '<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">'+
      '<span style="font-size:14px;font-weight:700;color:'+dc+'">'+(t.dir==="Long"?"Long":"Short")+'</span>'+
      '<span class="tag" style="background:'+sb+';color:'+sc2+'">'+t.strat+'</span></div>'+
      '<div style="font-size:11px;color:#444">'+t.date+' &middot; '+t.sess+' &middot; '+t.emo+'</div>'+
      '<div style="font-size:11px;color:#444">'+t.stop+'pts &middot; '+t.lots+' lots</div>'+
      (t.notes?'<div style="font-size:11px;color:#555;margin-top:3px;font-style:italic">'+t.notes+'</div>':'')+
      '</div><div style="text-align:right;min-width:70px">'+
      '<div style="font-size:20px;font-weight:700;color:'+pc(t.pnl)+'">'+fm(t.pnl)+'</div>'+
      '<div style="font-size:13px;color:#FFD700">'+st2+'</div>'+
      '<button class="btn btn-sm" onclick="dT('+t.id+')" style="background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.2);color:#ff1744;margin-top:6px">Del</button>'+
      '</div></div></div>';
  }
  el("p1").innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<div style="font-size:12px;color:#444">'+trades.length+' trades &middot; '+st.wr+'% WR</div>'+

  for(var i=0;i<pinned.length;i++)h+=nC(pinned[i]);

  if(!notes.length)h+='<div class="card" style="text-align:center;padding:40px;color:#333">No notes yet.</div>';
  el("p7").innerHTML=h;
}
function nC(n){
  return '<div style="background:#111;border:1px solid rgba(150,150,150,0.1);border-left:3px solid '+(n.pinned?"#FFD700":"#4169E1")+';border-radius:14px;padding:13px;margin-bottom:10px">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
    '<span style="font-size:10px;color:#444">'+n.time+'</span>'+
    '<div style="display:flex;gap:8px">'+
    '<button onclick="tP('+n.id+')" style="background:none;border:none;cursor:pointer;font-size:14px;opacity:'+(n.pinned?1:.3)+';color:#FFD700">Pin</button>'+
    '<button onclick="dN('+n.id+')" style="background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.2);border-radius:5px;color:#ff1744;font-size:10px;padding:2px 7px;cursor:pointer">Del</button>'+
    '</div></div><div style="font-size:13px;color:#ccc;line-height:1.6">'+n.text+'</div></div>';
}
function aN(){var t=el("nt");if(!t||!t.value.trim())return;notes.unshift({id:Date.now(),text:t.value.trim(),time:new Date().toLocaleString(),pinned:false});svN();renderNotes();}
function tP(id){for(var i=0;i<notes.length;i++)if(notes[i].id===id)notes[i].pinned=!notes[i].pinned;svN();renderNotes();}
function dN(id){notes=notes.filter(function(n){return n.id!==id;});svN();renderNotes();}

function renderPsych(){
  var disc=psych.filter(function(l){return !l.fo&&!l.rv&&!l.ov&&!l.br;}).length;
  var h='<div class="card"><div class="tl"></div>'+
    '<div style="font-size:13px;font-weight:700;color:#c084fc;margin-bottom:12px">Psychology Log</div>'+
    '<div class="g2">'+
    '<div><label>Date</label><input type="date" id="pd" value="'+new Date().toISOString().split("T")[0]+'"/></div>'+
    '<div><label>Before</label><select id="pb"><option>Focused</option><option>Confident</option><option>Anxious</option><option>Hesitant</option><option>Neutral</option></select></div>'+
    '<div><label>After</label><select id="pa"><option>Satisfied</option><option>Frustrated</option><option>Confident</option><option>Neutral</option><option>Tired</option></select></div>'+
    '<div><label>Notes</label><input id="pn" placeholder="What did you learn?"/></div></div>'+
    '<label style="margin-top:12px">Bad Habits Today</label>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin:8px 0 14px">'+
    '<label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0;padding:10px 12px;background:#0a0a0a;border-radius:10px;cursor:pointer;margin-top:0"><input type="checkbox" id="pfo" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> FOMO trading</label>'+
    '<label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0;padding:10px 12px;background:#0a0a0a;border-radius:10px;cursor:pointer;margin-top:0"><input type="checkbox" id="prv" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Revenge trading</label>'+
    '<label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0;padding:10px 12px;background:#0a0a0a;border-radius:10px;cursor:pointer;margin-top:0"><input type="checkbox" id="pov" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Oversized position</label>'+
    '<label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0;padding:10px 12px;background:#0a0a0a;border-radius:10px;cursor:pointer;margin-top:0"><input type="checkbox" id="pbr" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Broke rules</label>'+
    '</div><button class="btn" style="background:linear-gradient(135deg,#6A0DAD,#4169E1)" onclick="svPs2()">+ Save Log</button></div>';
  if(psych.length){
    h+='<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#aaa;margin-bottom:10px">Mindset Stats</div>'+
      '<div class="g2">'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#333;margin-bottom:2px">Days Logged</div><div style="font-size:20px;font-weight:700;color:#aaa">'+psych.length+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#333;margin-bottom:2px">Disciplined</div><div style="font-size:20px;font-weight:700;color:#00e676">'+disc+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#333;margin-bottom:2px">FOMO Days</div><div style="font-size:20px;font-weight:700;color:#ff6080">'+psych.filter(function(l){return l.fo;}).length+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#333;margin-bottom:2px">Discipline %</div><div style="font-size:20px;font-weight:700;color:#00e676">'+Math.round(disc/psych.length*100)+'%</div></div>'+
      '</div></div>';
    for(var i=0;i<psych.length;i++){
      var lg=psych[i],bad=lg.fo||lg.rv||lg.ov||lg.br;
      h+='<div style="background:#111;border:1px solid rgba(150,150,150,0.1);border-left:3px solid '+(bad?"#ff1744":"#00e676")+';border-radius:14px;padding:13px;margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px">'+
        '<span style="font-size:12px;font-weight:700;color:#aaa">'+lg.date+'</span>'+
        '<span class="tag" style="background:'+(bad?"rgba(255,23,68,.1)":"rgba(0,230,118,.1)")+';color:'+(bad?"#ff1744":"#00e676")+'">'+(bad?"Issues":"Disciplined")+'</span></div>'+
        '<div style="font-size:11px;color:#555">'+lg.before+' to '+lg.after+'</div>'+
        (lg.note?'<div style="font-size:11px;color:#555;font-style:italic;margin-top:3px">"'+lg.note+'"</div>':'')+
        '</div>';
    }
  }
  el("p8").innerHTML=h;
}
function svPs2(){
  psych.unshift({id:Date.now(),date:el("pd").value,before:el("pb").value,after:el("pa").value,note:el("pn").value,fo:el("pfo").checked,rv:el("prv").checked,ov:el("pov").checked,br:el("pbr").checked});
  svPs();renderPsych();
}

function renderSettings(){
  var key=localStorage.getItem("te_apikey")||"";
  var status=key?"Connected: ..."+key.slice(-6):"Not set";
  el("p9").innerHTML=
    '<div class="card" style="border-color:rgba(65,105,225,0.3)"><div class="tl"></div>'+
    '<div style="font-size:15px;font-weight:700;color:#7a9fff;margin-bottom:6px">Settings</div>'+
    '<div style="font-size:12px;color:#555;margin-bottom:14px;line-height:1.6">Your API key is saved only on this device. Never shared anywhere.</div>'+
    '<label style="margin-top:0">OpenRouter API Key</label>'+
    '<input type="password" id="aki" placeholder="sk-or-v1-..." style="margin-bottom:8px"/>'+
    '<div style="font-size:12px;margin-bottom:14px">Status: <b style="color:'+(key?"#00e676":"#ff1744")+'">'+status+'</b></div>'+
    '<button class="btn" onclick="svK()">Save API Key</button>'+
    '<button class="btn btn-g" onclick="clK()">Remove Key</button>'+
    '<div style="font-size:11px;color:#333;margin-top:10px;text-align:center">Get a free key at openrouter.ai/keys</div></div>'+
    '<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#aaa;margin-bottom:10px">App Info</div>'+
    '<div class="row"><span style="font-size:12px;color:#555">Version</span><span style="font-size:12px;color:#aaa">TradeEdge v1.0</span></div>'+
    '<div class="row"><span style="font-size:12px;color:#555">Instrument</span><span style="font-size:12px;color:#aaa">MNQ / MGC</span></div>'+
    '<div class="row"><span style="font-size:12px;color:#555">Risk per trade</span><span style="font-size:12px;color:#aaa">$120</span></div>'+
    '<div class="row"><span style="font-size:12px;color:#555">Daily SL / TP</span><span style="font-size:12px;color:#aaa">$360 / $540</span></div>'+
    '<div class="row"><span style="font-size:12px;color:#555">Weekly SL / TP</span><span style="font-size:12px;color:#aaa">$1,200 / $1,600</span></div></div>'+
    '<div class="card" style="border-left:3px solid #ff1744">'+
    '<div style="font-size:12px;color:#ff1744;font-weight:700;margin-bottom:6px">Danger Zone</div>'+
    '<div style="font-size:11px;color:#555;margin-bottom:10px">Deletes all trades, notes and logs permanently.</div>'+
    '<button class="btn btn-g" onclick="rAll()" style="color:#ff1744;border-color:rgba(255,23,68,.3);margin-top:0">Reset All Data</button></div>';
}
function svK(){var k=el("aki");if(!k||!k.value.trim())return;localStorage.setItem("te_apikey",k.value.trim());alert("API key saved! AI Coach is ready.");renderSettings();}
function clK(){localStorage.removeItem("te_apikey");renderSettings();}
function rAll(){if(confirm("Delete ALL data? Cannot be undone.")){localStorage.clear();trades=[];props=[];notes=[];psych=[];alert("Cleared.");go(0);}}

function go(i){
  closeSB();
  document.querySelectorAll(".pg").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".sbi").forEach(function(b,idx){b.classList.toggle("on",idx===i);});
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("on");});
  if(i===0)el("nb0").classList.add("on");
  if(i===1)el("nb1").classList.add("on");
  if(i===4)el("nb4").classList.add("on");
  el("p"+i).classList.add("on");
  curP=i;
  if(i===0)renderHome();
  else if(i===1)renderLog();
  else if(i===2)renderCalc();
  else if(i===3)renderAI();
  else if(i===4)renderStats();
  else if(i===5)renderRisk();
  else if(i===6)renderProps();
  else if(i===7)renderNotes();
  else if(i===8)renderPsych();
  else if(i===9)renderSettings();
}

function toggleFS(){
  var e=document.documentElement,b=el("fsbtn"),isF=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isF){var r=e.requestFullscreen||e.webkitRequestFullscreen;if(r)r.call(e);if(b)b.textContent="X";}
  else{var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);if(b)b.textContent="[]";}
}

window.onload=function(){renderHome();};
</script>
