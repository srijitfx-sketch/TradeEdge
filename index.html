<html><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TradeEdge</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#e8e8f0;font-family:Poppins,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
.hdr{background:linear-gradient(135deg,#0a0a14,#0e0e1c);padding:12px 16px;border-bottom:1px solid rgba(150,150,150,0.1);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
.logo{font-size:17px;font-weight:700;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,#ccc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo b{background:linear-gradient(90deg,#FFD700,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.badge{background:linear-gradient(135deg,#FFD700,#cc8800);color:#000;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;}
.hbtn{background:none;border:none;cursor:pointer;font-size:20px;padding:4px 6px;color:#aaa;}
.pg{padding:12px 12px 80px;display:none;}
.pg.on{display:block;}
/* SIDEBAR */
.sb-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100;display:none;transition:opacity .25s;}
.sb{position:fixed;top:0;left:-290px;width:280px;height:100%;background:linear-gradient(180deg,#0d0d1a,#0a0a0f);z-index:101;transition:left .25s ease;overflow-y:auto;padding-bottom:30px;}
.sb.open{left:0;}
.sb-head{padding:20px 18px 16px;border-bottom:1px solid rgba(150,150,150,0.1);}
.sb-logo{font-size:20px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#fff,#ccc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sb-logo b{background:linear-gradient(90deg,#FFD700,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sb-user{font-size:12px;color:#555;margin-top:4px;}
.sb-badge{display:inline-block;background:linear-gradient(135deg,#FFD700,#cc8800);color:#000;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:6px;}
.sb-sec{padding:12px 12px 4px;font-size:10px;color:#333;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
.sb-item{display:flex;align-items:center;gap:14px;padding:13px 18px;cursor:pointer;border-radius:0;transition:background .15s;border:none;background:none;width:100%;text-align:left;font-family:Poppins,sans-serif;}
.sb-item:hover{background:rgba(65,105,225,0.08);}
.sb-item.on{background:linear-gradient(90deg,rgba(65,105,225,0.18),rgba(106,13,173,0.1));border-left:3px solid #4169E1;}
.sb-item .si{font-size:20px;width:26px;text-align:center;}
.sb-item .sl{font-size:13px;color:#888;font-weight:500;}
.sb-item.on .sl{color:#fff;font-weight:700;}
.sb-div{height:1px;background:rgba(150,150,150,0.08);margin:8px 0;}
/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:linear-gradient(180deg,rgba(0,0,0,0),#000 20%);border-top:1px solid rgba(150,150,150,0.1);padding:6px 0 16px;z-index:50;display:flex;justify-content:space-around;}
.nb{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;opacity:.4;transition:all .2s;font-family:Poppins,sans-serif;}
.nb.on{opacity:1;transform:translateY(-2px);}
.nb .ni{font-size:20px;}
.nb .nl{font-size:9px;color:#444;font-weight:500;}
.nb.on .nl{color:#fff;font-weight:700;}
.nd{width:14px;height:2px;background:linear-gradient(90deg,#4169E1,#6A0DAD);border-radius:1px;display:none;}
.nb.on .nd{display:block;}
/* CARDS */
.card{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.12);border-radius:16px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;}
.tl{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(180,180,180,0.2),transparent);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sc{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.12);border-radius:14px;padding:12px;position:relative;overflow:hidden;}
.mbar{background:#0a0a0a;border-radius:20px;height:7px;overflow:hidden;border:1px solid rgba(150,150,150,0.08);margin-top:5px;}
.mfill{height:100%;border-radius:20px;transition:width .5s;}
input,select,textarea{background:#0a0a0a;border:1px solid rgba(150,150,150,0.2);border-radius:10px;padding:11px 13px;color:#e8e8f0;font-size:14px;font-family:Poppins,sans-serif;width:100%;outline:none;display:block;}
textarea{resize:none;min-height:70px;line-height:1.5;}
label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:5px;display:block;}
.btn{border:none;border-radius:11px;padding:12px 16px;color:#fff;font-family:Poppins,sans-serif;font-weight:700;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#4169E1,#6A0DAD);width:100%;}
.btn-g{background:linear-gradient(135deg,#161616,#1a1a1a);color:#777;border:1px solid rgba(150,150,150,0.15);}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:7px;width:auto;}
.alert{border-radius:14px;padding:10px 13px;margin-bottom:12px;font-size:12px;font-weight:600;}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:6px;}
.bc{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;}
.br{width:100%;border-radius:4px 4px 0 0;min-height:4px;}
.bl{font-size:9px;color:#444;}
.chat{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.bub{max-width:88%;padding:9px 13px;font-size:13px;line-height:1.65;color:#ddd;white-space:pre-wrap;}
.bub.u{background:linear-gradient(135deg,#4169E1,#6A0DAD);border-radius:14px 14px 4px 14px;align-self:flex-end;}
.bub.a{background:#161616;border:1px solid rgba(150,150,150,0.1);border-radius:14px 14px 14px 4px;align-self:flex-start;}
.crow{display:flex;gap:8px;}
.crow input{flex:1;}
.fs-btn{background:rgba(65,105,225,0.12);border:1px solid rgba(65,105,225,0.25);border-radius:8px;color:#7a9fff;font-size:13px;padding:4px 9px;cursor:pointer;font-weight:700;}
.note-card{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.1);border-radius:14px;padding:13px;margin-bottom:10px;}
.prop-card{background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.1);border-radius:14px;padding:14px;margin-bottom:10px;}
.tag{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;}
</style>
</head><body>

<div class="hdr">
  <button class="hbtn" onclick="openSB()" id="menubtn">&#9776;</button>
  <div class="logo">TRADE<b>EDGE</b></div>
  <div style="display:flex;align-items:center;gap:8px">

<!-- SIDEBAR -->
<div class="sb" id="sb">
  <div class="sb-head">

    <div class="sb-user">Good day, Srijit &#x1F91D;</div>
    <div class="sb-badge" id="sb-badge">&#x1F947; Trader</div>

  <div class="sb-sec">Main</div>
  <button class="sb-item on" onclick="go(0)"><span class="si">&#x1F3E0;</span><span class="sl">Dashboard</span></button>

  <button class="sb-item" onclick="go(6)"><span class="si">&#x1F4BC;</span><span class="sl">Prop Accounts</span></button>
  <button class="sb-item" onclick="go(7)"><span class="si">&#x1F4DD;</span><span class="sl">Market Notes</span></button>

</div>

<!-- PAGES -->
<div id="p0" class="pg on"></div>
<div id="p1" class="pg"></div>
<div id="p2" class="pg"></div>
<div id="p3" class="pg"></div>
<div id="p4" class="pg"></div>
<div id="p5" class="pg"></div>
<div id="p6" class="pg"></div>
<div id="p7" class="pg"></div>

<!-- BOTTOM NAV -->
<div class="nav">
  <button class="nb on" onclick="go(0)"><span class="ni">&#x1F3E0;</span><span class="nl">Home</span><div class="nd"></div></button>
  <button class="nb" onclick="go(1)"><span class="ni">&#x1F4D2;</span><span class="nl">Log</span><div class="nd"></div></button>
  <button class="nb" onclick="go(4)"><span class="ni">&#x1F4CA;</span><span class="nl">Stats</span><div class="nd"></div></button>
</div>

<script>
var LOTS=[{s:8,l:7,r:112,c:"tight"},{s:10,l:6,r:120,c:"tight"},{s:12,l:5,r:120,c:"normal"},{s:15,l:4,r:120,c:"normal"},{s:20,l:3,r:120,c:"normal"},{s:30,l:2,r:120,c:"wide"},{s:60,l:1,r:120,c:"wide"}];
var MGCL=[{s:1,l:12,r:120,c:"scalp"},{s:2,l:6,r:120,c:"scalp"},{s:3,l:4,r:120,c:"tight"},{s:4,l:3,r:120,c:"tight"},{s:5,l:2,r:100,c:"normal"},{s:6,l:2,r:120,c:"normal"},{s:8,l:1,r:80,c:"wide"},{s:10,l:1,r:100,c:"wide"},{s:12,l:1,r:120,c:"wide"}];
var CC={scalp:"#ff69b4",tight:"#9b59f5",normal:"#00e676",wide:"#ff9800"};
var QQ=["The goal of a successful trader is to make the best trades.","Plan the trade, trade the plan. Always.","Discipline is the bridge between goals and accomplishment.","The market rewards patience and punishes impulse.","Risk management is taking calculated risks."];
var TITLES=["Dashboard","Trade Log","Calculator","AI Coach","Analytics","Risk Rules","Prop Accounts","Market Notes","Psychology","Settings"];

var trades=JSON.parse(localStorage.getItem("te_trades")||"null")||[
  {id:1,date:"2026-05-19",dir:"Long",strat:"SMC",stop:10,lots:6,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"Clean demand zone BOS"},
  {id:2,date:"2026-05-20",dir:"Short",strat:"EMA+ST",stop:15,lots:4,pnl:-120,stars:3,sess:"London",emo:"Hesitant",notes:"Moved SL too early"},
  {id:3,date:"2026-05-21",dir:"Long",strat:"Both",stop:12,lots:5,pnl:180,stars:5,sess:"NY",emo:"Confident",notes:"Perfect confluence"},
  {id:4,date:"2026-05-22",dir:"Long",strat:"SMC",stop:8,lots:7,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"A+ demand zone"}
];
var propAccounts=JSON.parse(localStorage.getItem("te_props")||"[]");
var marketNotes=JSON.parse(localStorage.getItem("te_notes")||"[]");
var psychLogs=JSON.parse(localStorage.getItem("te_psych")||"[]");
var chatHist=[];
var starVal=5;
var calcMgc=false;
var curPg=0;
var apiKey=localStorage.getItem("te_apikey")||"";

function save(){localStorage.setItem("te_trades",JSON.stringify(trades));}
function saveProps(){localStorage.setItem("te_props",JSON.stringify(propAccounts));}
function saveNotes(){localStorage.setItem("te_notes",JSON.stringify(marketNotes));}
function savePsych(){localStorage.setItem("te_psych",JSON.stringify(psychLogs));}

function openSB(){document.getElementById("sb").classList.add("open");document.getElementById("sbbg").style.display="block";}
function closeSB(){document.getElementById("sb").classList.remove("open");document.getElementById("sbbg").style.display="none";}

function calcLots(s,mgc){
  if(!s||s<=0)return null;
  var max=mgc?12:60;if(s>max)return null;
  var l=Math.floor((mgc?12:60)/s);if(l<1)return null;
  var r=Math.round(l*s*(mgc?10:2));
  var tb=mgc?MGCL:LOTS,near=tb[0];
  for(var i=0;i<tb.length;i++){if(Math.abs(tb[i].s-s)<Math.abs(near.s-s))near=tb[i];}
  return{l:l,r:r,c:near.c};
}
function getLvl(n){
  if(n<10)return{n:10,lb:"Rookie"};if(n<25)return{n:25,lb:"Apprentice"};
  if(n<50)return{n:50,lb:"Trader"};if(n<75)return{n:75,lb:"Expert"};
  if(n<100)return{n:100,lb:"Master"};return{n:100,lb:"Legend"};
}
function getStats(){
  var today=new Date().toISOString().split("T")[0];
  var todayT=[],dPnl=0,wPnl=0;
  var ws=new Date();ws.setDate(ws.getDate()-ws.getDay());
  for(var i=0;i<trades.length;i++){
    if(trades[i].date===today){todayT.push(trades[i]);dPnl+=trades[i].pnl;}
    if(new Date(trades[i].date)>=ws)wPnl+=trades[i].pnl;
  }
  var wins=[],loss=[];
  for(var i=0;i<trades.length;i++){if(trades[i].pnl>0)wins.push(trades[i]);else loss.push(trades[i]);}
  var wr=trades.length?Math.round(wins.length/trades.length*100):0;
  var aW=0,aL=1;
  if(wins.length){var s=0;for(var i=0;i<wins.length;i++)s+=wins[i].pnl;aW=Math.round(s/wins.length);}
  if(loss.length){var s=0;for(var i=0;i<loss.length;i++)s+=loss[i].pnl;aL=Math.round(Math.abs(s/loss.length));}
  var rr=aL>0?(aW/aL).toFixed(1):"--";
  var tw=0,tl=0;for(var i=0;i<todayT.length;i++){if(todayT[i].pnl>0)tw++;else tl++;}
  return{dPnl:dPnl,wPnl:wPnl,wr:wr,aW:aW,aL:aL,rr:rr,tw:tw,tl:tl};
}
function meter(pct,fill){return '<div class="mbar"><div class="mfill" style="width:'+Math.min(100,pct)+'%;background:'+fill+'"></div></div>';}
function pc(v){return v>=0?"#00e676":"#ff1744";}
function fm(v){return (v>=0?"+$":"-$")+Math.abs(v);}

// ── HOME ──
function renderHome(){
  var st=getStats(),lvl=getLvl(trades.length),lp=Math.min(100,trades.length/lvl.n*100);
  var h=new Date().getHours(),gr=h<12?"Morning":h<17?"Afternoon":"Evening";
  var ac,ab,abr,am;
  if(st.dPnl<=-360){ac="#ff1744";ab="rgba(255,23,68,0.07)";abr="rgba(255,23,68,0.25)";am="&#x1F6D1; Daily loss limit hit! Stop trading now.";}
  else if(st.dPnl>=540){ac="#00e676";ab="rgba(0,230,118,0.05)";abr="rgba(0,230,118,0.2)";am="&#x1F3AF; Target hit! Consider stopping.";}
  else{ac="#4169E1";ab="rgba(65,105,225,0.05)";abr="rgba(65,105,225,0.15)";am="&#x26A1; Stay disciplined. Follow your rules.";}
  var bp=[-120,240,180,240,st.dPnl],bd=["Mon","Tue","Wed","Thu","Fri"],mx=1;
  for(var i=0;i<bp.length;i++){if(Math.abs(bp[i])>mx)mx=Math.abs(bp[i]);}
  var bars="";
  for(var i=0;i<bp.length;i++){
    var bh=Math.max(8,Math.round(Math.abs(bp[i])/mx*70));
    bars+='<div class="bc"><div class="br" style="height:'+bh+'px;background:'+(bp[i]>=0?"#00e676":"#ff1744")+'"></div><div class="bl">'+bd[i]+'</div></div>';
  }
  var ms=[["Daily Loss",Math.abs(Math.min(0,st.dPnl)),360,"linear-gradient(90deg,#ff1744,#8b0000)","#ff1744"],["Daily Profit",Math.max(0,st.dPnl),540,"linear-gradient(90deg,#FFD700,#cc8800)","#00e676"],["Weekly Loss",Math.abs(Math.min(0,st.wPnl)),1200,"linear-gradient(90deg,#6A0DAD,#4169E1)","#ff1744"],["Weekly Profit",Math.max(0,st.wPnl),1600,"linear-gradient(90deg,#FFD700,#cc8800)","#00e676"]];
  var mh="";for(var i=0;i<ms.length;i++){mh+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#666">'+ms[i][0]+'</span><span style="color:'+ms[i][4]+';font-weight:700">$'+ms[i][1]+' / $'+ms[i][2]+'</span></div>'+meter(ms[i][1]/ms[i][2]*100,ms[i][3])+'</div>';}
  var sc=[["Weekly P&L",fm(st.wPnl),pc(st.wPnl),"Target $1,600"],["Win Rate",st.wr+"%","#FFD700",trades.length+" trades"],["Risk:Reward","1:"+st.rr,"#00e5ff","Target 1:2"],["Avg Win","$"+st.aW,"#00e676","Avg loss $"+st.aL]];
  var sh="";for(var i=0;i<sc.length;i++){sh+='<div class="sc"><div style="font-size:10px;color:#555;margin-bottom:3px">'+sc[i][0]+'</div><div style="font-size:19px;font-weight:700;color:'+sc[i][2]+'">'+sc[i][1]+'</div><div style="font-size:10px;color:#333;margin-top:2px">'+sc[i][3]+'</div></div>';}
  document.getElementById("p0").innerHTML=
    '<div class="card" style="background:linear-gradient(145deg,#0a0a1a,#111122);border-color:rgba(65,105,225,0.2)"><div class="tl"></div>'+
    '<div style="font-size:11px;color:#555;margin-bottom:3px">Good '+gr+', <b style="color:#fff">Srijit</b></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="font-size:10px;color:#444;text-transform:uppercase;letter-spacing:1px">Today P&L</div>'+
    '<div style="font-size:34px;font-weight:700;color:'+pc(st.dPnl)+'">'+fm(st.dPnl)+'</div>'+
    '<div style="font-size:11px;color:#444">'+st.tw+'W &middot; '+st.tl+'L</div></div>'+
    '<div style="text-align:center"><div style="font-size:28px">&#x1F947;</div>'+
    '<div style="font-size:10px;color:#FFD700;font-weight:700">'+lvl.lb+'</div>'+
    '<div style="font-size:10px;color:#333">'+trades.length+' trades</div></div></div>'+
    meter(lp,"linear-gradient(90deg,#FFD700,#cc8800)")+
    '<div style="font-size:10px;color:#333;margin-top:4px;text-align:right">'+(lvl.n-trades.length>0?(lvl.n-trades.length)+" to next level":"&#x1F3C6; Legend!")+'</div></div>'+
    '<div class="alert" style="color:'+ac+';background:'+ab+';border:1px solid '+abr+'">'+am+'</div>'+
    '<div class="g2" style="margin-bottom:12px">'+sh+'</div>'+
    '<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#FFD700;margin-bottom:10px">&#x1F6E1; Risk Meters</div>'+mh+'</div>'+
    '<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#666;margin-bottom:6px">&#x1F4C8; This Week</div><div class="bars">'+bars+'</div></div>'+
    '<div class="card" style="border-left:3px solid #4169E1"><div style="font-size:10px;color:#4169E1;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">Daily Quote</div>'+
    '<div style="font-size:12px;color:#666;font-style:italic;line-height:1.6">"'+QQ[new Date().getDay()%QQ.length]+'"</div></div>';
  document.getElementById("lvlbadge").textContent=lvl.lb;
  document.getElementById("sb-badge").textContent=lvl.lb;
}

// ── TRADE LOG ──
function renderLog(){
  var st=getStats(),list="";
  for(var i=trades.length-1;i>=0;i--){
    var t=trades[i];
    var dc=t.dir==="Long"?"#00e676":"#ff1744";
    var sc=t.strat==="Both"?"#FFD700":t.strat==="SMC"?"#8aacff":"#c084fc";
    var sb=t.strat==="Both"?"rgba(255,215,0,.1)":t.strat==="SMC"?"rgba(65,105,225,.1)":"rgba(106,13,173,.1)";
    var stars="";for(var s=0;s<t.stars;s++)stars+="&#x2B50;";
    list+='<div style="background:linear-gradient(145deg,#111,#181818);border:1px solid rgba(150,150,150,0.1);border-left:3px solid '+pc(t.pnl)+';border-radius:14px;padding:13px;margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between">'+

        '<div style="background:#0a0a0a;border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:#444;margin-bottom:3px">P&L</div><div style="font-size:14px;font-weight:700;color:'+(profit>=0?"#00e676":"#ff1744")+'">'+(profit>=0?"+$":"-$")+Math.abs(profit).toLocaleString()+'</div></div></div>'+
        '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:3px"><span>Profit Progress</span><span style="color:#00e676">'+ppct.toFixed(0)+'%</span></div>'+meter(ppct,"linear-gradient(90deg,#00e676,#00a050)")+'</div>'+
        '<div><div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:3px"><span>Drawdown Used</span><span style="color:'+(ddpct>70?"#ff1744":"#FFD700")+'">'+ddpct.toFixed(0)+'%</span></div>'+meter(ddpct,"linear-gradient(90deg,#ff1744,#8b0000)")+'</div></div>';

function hidePropForm(){document.getElementById("pform").style.display="none";}
function saveProp(){
  var firm=document.getElementById("pfirm").value;if(!firm)return;
  propAccounts.push({id:Date.now(),firm:firm,type:document.getElementById("ptype").value,size:document.getElementById("psize").value,start:document.getElementById("pstart").value,curr:document.getElementById("pcurr").value,pt:document.getElementById("ppt").value,dd:document.getElementById("pdd").value});

function delProp(id){var na=[];for(var i=0;i<propAccounts.length;i++)if(propAccounts[i].id!==id)na.push(propAccounts[i]);propAccounts=na;saveProps();renderProps();}

// ── MARKET NOTES ──
function renderNotes(){
  var pinned=[],unpinned=[];
  for(var i=0;i<marketNotes.length;i++){if(marketNotes[i].pinned)pinned.push(marketNotes[i]);else unpinned.push(marketNotes[i]);}
  var html='<div class="card"><div class="tl"></div><div style="font-size:13px;font-weight:700;color:#aaa;margin-bottom:10px">&#x1F4DD; Add Market Note</div>'+
    '<textarea id="ntxt" placeholder="Levels, bias, setups, S/R zones, news..." style="margin-bottom:10px"></textarea>'+
    '<button class="btn" onclick="addNote()">+ Add Note</button></div>';
  if(pinned.length>0){html+='<div style="font-size:11px;color:#FFD700;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:4px">&#x1F4CC; Pinned</div>';}
  for(var i=0;i<pinned.length;i++){html+=noteCard(pinned[i],true);}
  for(var i=0;i<unpinned.length;i++){html+=noteCard(unpinned[i],false);}
  if(marketNotes.length===0){html+='<div class="card" style="text-align:center;padding:50px"><div style="font-size:40px;margin-bottom:10px">&#x1F4DD;</div><div style="color:#333;font-size:13px">No notes yet. Start observing!</div></div>';}
  document.getElementById("p7").innerHTML=html;
}
function noteCard(n,pinned){
  return '<div class="note-card" style="border-left:3px solid '+(pinned?"#FFD700":"#4169E1")+'">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
    '<span style="font-size:10px;color:#444">'+n.time+'</span>'+
    '<div style="display:flex;gap:8px">'+
    '<button onclick="togglePin('+n.id+')" style="background:none;border:none;cursor:pointer;font-size:16px;opacity:'+(pinned?"1":".3")+'">&#x1F4CC;</button>'+
    '<button onclick="delNote('+n.id+')" style="background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.2);border-radius:5px;color:#ff1744;font-size:10px;padding:2px 7px;cursor:pointer">&#x2715;</button>'+
    '</div></div><div style="font-size:13px;color:#ccc;line-height:1.6">'+n.text+'</div></div>';
}
function addNote(){var txt=document.getElementById("ntxt").value.trim();if(!txt)return;marketNotes.unshift({id:Date.now(),text:txt,time:new Date().toLocaleString(),pinned:false});saveNotes();renderNotes();}
function togglePin(id){for(var i=0;i<marketNotes.length;i++)if(marketNotes[i].id===id)marketNotes[i].pinned=!marketNotes[i].pinned;saveNotes();renderNotes();}
function delNote(id){var na=[];for(var i=0;i<marketNotes.length;i++)if(marketNotes[i].id!==id)na.push(marketNotes[i]);marketNotes=na;saveNotes();renderNotes();}

// ── PSYCHOLOGY ──
function renderPsych(){
  var disc=0;for(var i=0;i<psychLogs.length;i++)if(!psychLogs[i].fomo&&!psychLogs[i].revenge&&!psychLogs[i].oversize&&!psychLogs[i].rules)disc++;
  var html='<div class="card"><div class="tl"></div><div style="font-size:13px;font-weight:700;color:#c084fc;margin-bottom:12px">&#x1F9E0; Daily Psychology Log</div>'+
    '<div class="g2" style="margin-bottom:10px">'+
    '<div><label>Date</label><input type="date" id="pdate" value="'+new Date().toISOString().split("T")[0]+'"/></div>'+
    '<div><label>Before Session</label><select id="pbefore"><option>Focused</option><option>Confident</option><option>Excited</option><option>Anxious</option><option>Hesitant</option><option>Neutral</option></select></div>'+
    '<div><label>After Session</label><select id="pafter"><option>Satisfied</option><option>Frustrated</option><option>Confident</option><option>Neutral</option><option>Tired</option></select></div>'+
    '<div><label>Reflection</label><input id="pnote" placeholder="What did you learn?"/></div></div>'+
    '<label style="margin-bottom:10px">Bad Habits Today</label>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">'+
    '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0a0a;border-radius:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0"><input type="checkbox" id="pfomo" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Traded out of FOMO</label>'+
    '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0a0a;border-radius:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0"><input type="checkbox" id="prevenge" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Revenge traded</label>'+
    '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0a0a;border-radius:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0"><input type="checkbox" id="pover" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Oversized position</label>'+
    '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0a0a;border-radius:10px;text-transform:none;font-size:13px;color:#777;letter-spacing:0"><input type="checkbox" id="prules" style="width:18px;height:18px;flex-shrink:0;margin-bottom:0"> Broke trading rules</label>'+
    '</div><button class="btn" style="background:linear-gradient(135deg,#6A0DAD,#4169E1)" onclick="savePsych()">+ Save Log</button></div>';
  if(psychLogs.length>0){
    html+='<div class="card"><div class="tl"></div><div style="font-size:12px;font-weight:700;color:#aaa;margin-bottom:10px">Mindset Stats</div>'+
      '<div class="g2" style="gap:8px">'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#444;margin-bottom:3px">Days Logged</div><div style="font-size:20px;font-weight:700;color:#aaa">'+psychLogs.length+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#444;margin-bottom:3px">Disciplined</div><div style="font-size:20px;font-weight:700;color:#00e676">'+disc+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#444;margin-bottom:3px">FOMO Days</div><div style="font-size:20px;font-weight:700;color:#ff6080">'+psychLogs.filter(function(l){return l.fomo;}).length+'</div></div>'+
      '<div style="background:#0a0a0a;border-radius:10px;padding:10px"><div style="font-size:10px;color:#444;margin-bottom:3px">Discipline %</div><div style="font-size:20px;font-weight:700;color:#00e676">'+Math.round(disc/psychLogs.length*100)+'%</div></div>'+
      '</div></div>';
    for(var i=0;i<psychLogs.length;i++){
      var log=psychLogs[i],bad=log.fomo||log.revenge||log.oversize||log.rules;
      html+='<div class="note-card" style="border-left:3px solid '+(bad?"#ff1744":"#00e676")+'">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px">'+
        '<span style="font-size:12px;font-weight:700;color:#aaa">'+log.date+'</span>'+
        '<span style="font-size:10px;padding:2px 9px;border-radius:20px;background:'+(bad?"rgba(255,23,68,.1)":"rgba(0,230,118,.1)")+';color:'+(bad?"#ff1744":"#00e676")+';border:1px solid '+(bad?"rgba(255,23,68,.3)":"rgba(0,230,118,.3)")+'">'+( bad?"Issues":"Disciplined")+'</span></div>'+
        '<div style="font-size:11px;color:#555">Before: '+log.before+' &rarr; After: '+log.after+'</div>'+
        (log.note?'<div style="font-size:11px;color:#555;font-style:italic;margin-top:3px">"'+log.note+'"</div>':'')+
        '</div>';
    }
  }
  document.getElementById("p8").innerHTML=html;
}
function savePsych(){
  psychLogs.unshift({id:Date.now(),date:document.getElementById("pdate").value,before:document.getElementById("pbefore").value,after:document.getElementById("pafter").value,note:document.getElementById("pnote").value,fomo:document.getElementById("pfomo").checked,revenge:document.getElementById("prevenge").checked,oversize:document.getElementById("pover").checked,rules:document.getElementById("prules").checked});
  savePsych2();renderPsych();
}
function savePsych2(){localStorage.setItem("te_psych",JSON.stringify(psychLogs));}

    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(150,150,150,.06)"><span style="font-size:12px;color:#555">Instrument</span><span style="font-size:12px;color:#aaa">MNQ / MGC</span></div>'+

    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(150,150,150,.06)"><span style="font-size:12px;color:#555">Daily SL / TP</span><span style="font-size:12px;color:#aaa">$360 / $540</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:12px;color:#555">Weekly SL / TP</span><span style="font-size:12px;color:#aaa">$1,200 / $1,600</span></div></div>'+

    '<div class="card" style="border-left:3px solid #ff1744"><div style="font-size:12px;color:#ff1744;font-weight:700;margin-bottom:6px">⚠️ Danger Zone</div>'+
    '<div style="font-size:11px;color:#555;margin-bottom:10px">Deletes all trades, notes and logs permanently.</div>'+
    '<button class="btn btn-g" onclick="resetAll()" style="color:#ff1744;border-color:rgba(255,23,68,.3)">🗑️ Reset All Data</button></div>';
}
function saveKey(){
  var k=document.getElementById("apiinp").value.trim();
  if(!k)return;
  localStorage.setItem("te_apikey",k);
  apiKey=k;
  alert("API key saved! AI Coach is ready.");
  renderSettings();
}
function clearKey(){
  localStorage.removeItem("te_apikey");
  apiKey="";
  renderSettings();
}
function resetAll(){
  if(confirm("Delete ALL data? This cannot be undone.")){
    localStorage.clear();
    trades=[];propAccounts=[];marketNotes=[];psychLogs=[];
    alert("All data cleared.");
    go(0);
  }
}
function go(i){
  closeSB();
  document.querySelectorAll(".pg").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".nb").forEach(function(b,idx){b.classList.toggle("on",idx===i);});
  document.querySelectorAll(".sb-item").forEach(function(b,idx){b.classList.toggle("on",idx===i);});
  document.getElementById("p"+i).classList.add("on");
  curPg=i;
  if(i===0)renderHome();
  else if(i===1)renderLog();
  else if(i===2)renderCalc();
  else if(i===3)renderAI();
  else if(i===4)renderStats();
  else if(i===5)renderRisk();
  else if(i===6)renderProps();
  else if(i===7)renderNotes();
  else if(i===8)renderPsych();
  else if(i===9){renderSettings();}
}
function toggleFS(){
  var el=document.documentElement,btn=document.getElementById("fsbtn"),isFs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isFs){var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;if(req)req.call(el);if(btn)btn.innerHTML="&#x2715;";}
  else{var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;if(ex)ex.call(document);if(btn)btn.innerHTML="&#x26F6;";}
}
document.addEventListener("fullscreenchange",function(){var b=document.getElementById("fsbtn");if(b)b.innerHTML=document.fullscreenElement?"&#x2715;":"&#x26F6;";});
document.addEventListener("webkitfullscreenchange",function(){var b=document.getElementById("fsbtn");if(b)b.innerHTML=document.webkitFullscreenElement?"&#x2715;":"&#x26F6;";});

renderHome();
