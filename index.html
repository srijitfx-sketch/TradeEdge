<html><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TradeEdge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0a08;--bg2:#111110;--bg3:#1a1a17;--bg4:#222220;--gold:#D4A017;--gold2:#F5C842;--green:#4CAF50;--red:#E53935;--text:#E8E6DF;--text2:#9E9B8E;--text3:#5C5A52;--border:rgba(212,160,23,0.15);--border2:rgba(255,255,255,0.06);}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:85px;overflow-x:hidden;}
/* HEADER */
.hdr{padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border2);}
.hdr-left{display:flex;align-items:center;gap:10px;}
.menu-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:2px;line-height:1;}
.mkt-status{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.lvl-pill{background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;}
.fs-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:12px;padding:4px 8px;cursor:pointer;}
/* PAGES */
.pg{display:none;padding:0 0 8px;}
.pg.on{display:block;}
/* SIDEBAR */
.sbbg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:60;display:none;}
.sb{position:fixed;top:0;left:-300px;width:285px;height:100%;background:var(--bg2);z-index:61;transition:left .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;border-right:1px solid var(--border2);}
.sb.open{left:0;}
.sb-head{padding:24px 18px 18px;border-bottom:1px solid var(--border2);}
.sb-logo{font-size:18px;font-weight:800;letter-spacing:2px;color:var(--text);}
.sb-logo span{color:var(--gold);}
.sb-sub{font-size:11px;color:var(--text3);margin-top:3px;letter-spacing:0.5px;}
.sb-badge{display:inline-block;background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px;}
.sb-sec{padding:14px 18px 5px;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-weight:600;}
.sbi{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;border-left:3px solid transparent;transition:all .15s;}
.sbi:hover{background:rgba(212,160,23,0.05);}
.sbi.on{background:rgba(212,160,23,0.08);border-left-color:var(--gold);}
.sbi .ic{font-size:16px;width:22px;text-align:center;}
.sbi .lb{font-size:13px;color:var(--text2);font-weight:500;}
.sbi.on .lb{color:var(--text);font-weight:600;}
.sdiv{height:1px;background:var(--border2);margin:6px 0;}
/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1px solid var(--border2);padding:6px 8px 18px;z-index:50;display:flex;justify-content:space-around;align-items:flex-end;}
.nb{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;opacity:.45;transition:all .2s;font-family:'Inter',sans-serif;}
.nb.on{opacity:1;}
.nb .ni{font-size:19px;}
.nb .nl{font-size:9px;color:var(--text3);font-weight:500;letter-spacing:0.5px;text-transform:uppercase;}
.nb.on .nl{color:var(--gold);font-weight:700;}
.nb-ai{background:var(--gold);border:none;border-radius:50%;width:52px;height:52px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px;box-shadow:0 4px 20px rgba(212,160,23,0.4);transition:transform .2s;}
.nb-ai:active{transform:scale(0.95);}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:10px;}
.card-gold{border-color:var(--border);}
.mono{font-family:'JetBrains Mono',monospace;}
/* TAGS */
.tag{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;}
.tag-long{background:rgba(76,175,80,0.15);color:var(--green);}
.tag-short{background:rgba(229,57,53,0.15);color:var(--red);}
.tag-gold{background:rgba(212,160,23,0.15);color:var(--gold);}
/* INPUTS */
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;width:100%;outline:none;display:block;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);}
textarea{resize:none;line-height:1.5;}
label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:5px;display:block;margin-top:12px;}
label:first-child{margin-top:0;}
.btn{border:none;border-radius:10px;padding:12px 16px;color:#000;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;background:var(--gold);width:100%;display:block;margin-top:12px;letter-spacing:0.3px;}
.btn-d{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);}
.btn-r{background:rgba(229,57,53,0.15);color:var(--red);border:1px solid rgba(229,57,53,0.2);}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:8px;width:auto;display:inline-block;margin-top:0;}
/* METER */
.mbar{background:var(--bg4);border-radius:20px;height:5px;overflow:hidden;margin-top:5px;}
.mfill{height:100%;border-radius:20px;transition:width .5s;}
/* MISC */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border2);}
.row:last-child{border-bottom:none;}
.sec{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.chat-area{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0;}
.bub{max-width:82%;padding:10px 14px;font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;}
.bub.u{background:var(--gold);color:#000;border-radius:14px 14px 4px 14px;align-self:flex-end;font-weight:500;}
.bub.a{background:var(--bg3);border:1px solid var(--border2);border-radius:4px 14px 14px 14px;align-self:flex-start;}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;cursor:pointer;background:var(--bg3);border:1px solid transparent;}
.cal-day.has-trade{border-color:var(--border);}
.cal-day.profit{background:rgba(76,175,80,0.12);border-color:rgba(76,175,80,0.25);}
.cal-day.loss{background:rgba(229,57,53,0.1);border-color:rgba(229,57,53,0.2);}
.cal-day.today{border-color:var(--gold);border-width:2px;}
.cal-dn{font-size:10px;font-weight:600;color:var(--text2);}
.cal-pnl{font-size:8px;font-weight:700;margin-top:1px;}
/* TRADE CARD */
.trade-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border2);}
.trade-icon{width:38px;height:38px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:0.5px;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.trade-icon.profit{background:rgba(76,175,80,0.1);border-color:rgba(76,175,80,0.25);color:var(--green);}
.trade-icon.loss{background:rgba(229,57,53,0.08);border-color:rgba(229,57,53,0.2);color:var(--red);}
/* FILTER TABS */
.ftabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.ftabs::-webkit-scrollbar{display:none;}
.ftab{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text2);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:6px 14px;cursor:pointer;white-space:nowrap;letter-spacing:0.3px;}
.ftab.on{background:var(--gold);color:#000;border-color:var(--gold);}
/* STAT BOX */
.stat-box{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:14px;}
.stat-label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.stat-val{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);}
.stat-sub{font-size:10px;color:var(--text3);margin-top:3px;}
.badge-change{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:4px;}
.badge-up{background:rgba(76,175,80,0.15);color:var(--green);}
.badge-dn{background:rgba(229,57,53,0.1);color:var(--red);}
/* ALERT BOX */
.ai-alert{background:rgba(212,160,23,0.08);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
.ai-orb{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 0 12px rgba(212,160,23,0.4);}
.ai-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.ai-text{font-size:12px;color:var(--text2);line-height:1.6;}
/* TICKER */
.ticker-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;margin-bottom:10px;overflow:hidden;}
</style>
</head>

<script>
// ── CONTRACT DATA ──
var CONTRACTS={
  // Equity Index Micros
  MNQ:{name:"Micro E-mini NASDAQ",cat:"Micro Index",tick:0.25,tickVal:0.50,pointVal:2,unit:"points"},
  MES:{name:"Micro E-mini S&P 500",cat:"Micro Index",tick:0.25,tickVal:1.25,pointVal:5,unit:"points"},
  MYM:{name:"Micro E-mini Dow",cat:"Micro Index",tick:1,tickVal:0.50,pointVal:0.50,unit:"points"},
  M2K:{name:"Micro E-mini Russell 2K",cat:"Micro Index",tick:0.1,tickVal:0.50,pointVal:5,unit:"points"},

  NQ:{name:"E-mini NASDAQ 100",cat:"Index",tick:0.25,tickVal:5,pointVal:20,unit:"points"},
  ES:{name:"E-mini S&P 500",cat:"Index",tick:0.25,tickVal:12.50,pointVal:50,unit:"points"},
  YM:{name:"E-mini Dow Jones",cat:"Index",tick:1,tickVal:5,pointVal:5,unit:"points"},
  RTY:{name:"E-mini Russell 2000",cat:"Index",tick:0.1,tickVal:5,pointVal:50,unit:"points"},
  // Metals
  MGC:{name:"Micro Gold",cat:"Micro Metal",tick:0.10,tickVal:1,pointVal:10,unit:"$"},
  GC:{name:"Gold",cat:"Metal",tick:0.10,tickVal:10,pointVal:100,unit:"$"},
  SIL:{name:"Micro Silver",cat:"Micro Metal",tick:0.005,tickVal:1,pointVal:200,unit:"$"},

  // Energy
  MCL:{name:"Micro WTI Crude Oil",cat:"Micro Energy",tick:0.01,tickVal:1,pointVal:100,unit:"$"},
  CL:{name:"WTI Crude Oil",cat:"Energy",tick:0.01,tickVal:10,pointVal:1000,unit:"$"},
  NG:{name:"Natural Gas",cat:"Energy",tick:0.001,tickVal:10,pointVal:10000,unit:"$"},
  // Grains
  ZS:{name:"Soybeans",cat:"Grain",tick:0.25,tickVal:12.50,pointVal:50,unit:"cents"},
  ZC:{name:"Corn",cat:"Grain",tick:0.25,tickVal:12.50,pointVal:50,unit:"cents"},
  ZW:{name:"Wheat",cat:"Grain",tick:0.25,tickVal:12.50,pointVal:50,unit:"cents"}
};

var QUOTES=["The goal of a successful trader is to make the best trades.","Plan the trade, trade the plan. Always.","Discipline is the bridge between goals and accomplishment.","The market rewards patience and punishes impulse.","Risk management is taking calculated risks.","A+ setups only. Patience is the edge."];

var trades=JSON.parse(localStorage.getItem("te_trades")||"null")||[
  {id:1,date:"2026-05-19",dir:"Long",instrument:"MNQ",strat:"SMC",stop:10,lots:6,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"Clean demand zone BOS",entry:0,exit:0,rMultiple:2.0},
  {id:2,date:"2026-05-20",dir:"Short",instrument:"MNQ",strat:"EMA+ST",stop:15,lots:4,pnl:-120,stars:3,sess:"London",emo:"Hesitant",notes:"Moved SL too early",entry:0,exit:0,rMultiple:-1.0},
  {id:3,date:"2026-05-21",dir:"Long",instrument:"MNQ",strat:"Both",stop:12,lots:5,pnl:180,stars:5,sess:"NY",emo:"Confident",notes:"Perfect confluence",entry:0,exit:0,rMultiple:1.5},
  {id:4,date:"2026-05-22",dir:"Long",instrument:"MNQ",strat:"SMC",stop:8,lots:7,pnl:240,stars:4,sess:"NY",emo:"Focused",notes:"A+ demand zone",entry:0,exit:0,rMultiple:2.0}
];
var props=JSON.parse(localStorage.getItem("te_props")||"[]");
var notes=JSON.parse(localStorage.getItem("te_notes")||"[]");
var psych=JSON.parse(localStorage.getItem("te_psych")||"[]");
var chatH=[];
var starV=5;
var curP=0;
var tradeFilter="ALL";

function svT(){localStorage.setItem("te_trades",JSON.stringify(trades));}
function svP(){localStorage.setItem("te_props",JSON.stringify(props));}
function svN(){localStorage.setItem("te_notes",JSON.stringify(notes));}
function svPs(){localStorage.setItem("te_psych",JSON.stringify(psych));}
function el(id){return document.getElementById(id);}

function openSB(){el("sb").classList.add("open");el("sbbg").style.display="block";}
function closeSB(){el("sb").classList.remove("open");el("sbbg").style.display="none";}

function gLv(n){
  if(n<10)return{n:10,lb:"ROOKIE"};if(n<25)return{n:25,lb:"APPRENTICE"};
  if(n<50)return{n:50,lb:"TRADER"};if(n<75)return{n:75,lb:"EXPERT"};
  if(n<100)return{n:100,lb:"MASTER"};return{n:100,lb:"LEGEND"};
}
function gSt(){
  var today=new Date().toISOString().split("T")[0],dP=0,wP=0,totP=0;
  var ws=new Date();ws.setDate(ws.getDate()-ws.getDay());
  var tw=0,tl=0,wins=[],loss=[];
  for(var i=0;i<trades.length;i++){
    var t=trades[i];totP+=t.pnl;
    if(t.date===today){dP+=t.pnl;if(t.pnl>0)tw++;else tl++;}
    if(new Date(t.date)>=ws)wP+=t.pnl;
    if(t.pnl>0)wins.push(t);else loss.push(t);
  }
  var wr=trades.length?Math.round(wins.length/trades.length*100):0;
  var aW=0,aL=1,pF=0;
  if(wins.length){var s=0;for(var i=0;i<wins.length;i++)s+=wins[i].pnl;aW=Math.round(s/wins.length);}
  if(loss.length){var s=0;for(var i=0;i<loss.length;i++)s+=loss[i].pnl;aL=Math.round(Math.abs(s/loss.length));}
  if(aL>0){var tw2=0,tl2=0;for(var i=0;i<wins.length;i++)tw2+=wins[i].pnl;for(var i=0;i<loss.length;i++)tl2+=Math.abs(loss[i].pnl);pF=tl2>0?(tw2/tl2).toFixed(2):0;}
  var rr=aL>0?(aW/aL).toFixed(1):"--";
  var avgR=0;if(trades.length){var rs=0;for(var i=0;i<trades.length;i++)rs+=(trades[i].rMultiple||0);avgR=(rs/trades.length).toFixed(2);}
  return{dP:dP,wP:wP,totP:totP,wr:wr,aW:aW,aL:aL,rr:rr,tw:tw,tl:tl,pF:pF,avgR:avgR};
}
function pc(v){return v>=0?"var(--green)":"var(--red)";}
function fm(v){return (v>=0?"+$":"-$")+Math.abs(v);}
function mt(p,c){return '<div class="mbar"><div class="mfill" style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+c+'"></div></div>';}

function setMktStatus(){
  var h=new Date().getHours(),d=new Date().getDay();
  var s=(d>0&&d<6&&h>=9&&h<17)?"MARKET OPEN":"MARKET CLOSED";
  var el2=el("mkt-status");if(el2)el2.textContent=s;
  el2.style.color=s==="MARKET OPEN"?"var(--green)":"var(--text3)";
}

// ── DASHBOARD ──
function renderHome(){
  var st=gSt(),lv=gLv(trades.length);
  var h=new Date().getHours(),gr=h<12?"GOOD MORNING":h<17?"GOOD AFTERNOON":"GOOD EVENING";
  var d=new Date(),ds=["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()];
  var ms=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()];
  var dateStr=ds+" &middot; "+d.getDate()+" "+ms+" &middot; "+(h>=9&&h<17&&d.getDay()>0&&d.getDay()<6?"MARKET OPEN":"MARKET CLOSED");
  var aiMsg=st.dP>=540?"You've hit your daily target! Great discipline today. Consider stopping.":st.dP<=-360?"Daily loss limit reached. Protect your account — stop trading now.":trades.length>0?"Win rate "+st.wr+"% this month. Keep following your A+ setups.":"Welcome back! Log your first trade to get personalized insights.";
  var prevMonthPnl=800;
  var mtdChange=prevMonthPnl>0?((st.totP-prevMonthPnl)/prevMonthPnl*100).toFixed(1):0;

// ── JOURNAL ──
function renderJournal(){
  var byDate={};
  for(var i=0;i<trades.length;i++){
    var t=trades[i];
    if(!byDate[t.date])byDate[t.date]={trades:[],pnl:0};
    byDate[t.date].trades.push(t);
    byDate[t.date].pnl+=t.pnl;
  }
  var dates=Object.keys(byDate).sort().reverse();
  var entries=dates.map(function(d){
    var day=byDate[d];
    var dow=["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(d).getDay()];
    var dd=new Date(d).getDate();
    var tags=[];
    var hasFomo=false,hasGood=true;
    for(var i=0;i<day.trades.length;i++){
      if(day.trades[i].emo==="FOMO"||day.trades[i].emo==="Revenge")hasFomo=true;
      if(day.trades[i].pnl<0)hasGood=false;
    }
    if(hasFomo)tags.push("FOMO");
    if(day.trades.every(function(t){return t.stars>=4;}))tags.push("A+ SETUPS");
    if(day.pnl>=300)tags.push("DISCIPLINE");
    var firstNote=day.trades[0].notes||"No notes for this session.";
    return '<div class="card" style="cursor:pointer">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div style="font-size:10px;color:var(--text3);letter-spacing:1px">'+dow+' '+dd+' &middot; '+day.trades.length+' TRADE'+(day.trades.length>1?"S":"")+'</div>'+
      '<div style="font-size:14px;font-weight:700;color:'+pc(day.pnl)+';font-family:JetBrains Mono,monospace">'+fm(day.pnl)+'</div>'+
      '</div>'+
      '<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4">'+firstNote+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      tags.map(function(tg){return '<span style="font-size:9px;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:2px 7px;color:var(--text3);letter-spacing:1px;font-weight:600">'+tg+'</span>';}).join('')+
      '</div></div>';
  }).join('');
  var st=gSt();
  var aiJournalMsg=st.wr>60?"Strong win rate this month. Your best sessions correlate with patient, A+ setups only.":st.wr<40?"Focus on quality over quantity. Fewer but better trades will improve your metrics.":"Consistent logging helps identify patterns. Keep journaling every session.";
  el("p2").innerHTML=
    '<div style="padding:16px 18px 8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
    '<div><div style="font-size:18px;font-weight:800;letter-spacing:1px">JOURNAL</div>'+
    '<div style="font-size:10px;color:var(--text3);letter-spacing:1px">'+dates.length+' ENTRIES</div></div>'+
    '</div>'+
    '<div class="ai-alert">'+
    '<div class="ai-orb">&#129302;</div>'+
    '<div><div class="ai-label">TradeEdge AI</div><div class="ai-text">'+aiJournalMsg+'</div></div>'+
    '</div>'+
    (entries||'<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px">No journal entries yet.<br>Log trades to build your journal.</div>')+
    '</div>';
}

// ── CALENDAR ──
function renderCalendar(){
  var now=new Date();
  var year=now.getFullYear(),month=now.getMonth();
  var months=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var byDate={};var monthPnl=0;
  for(var i=0;i<trades.length;i++){
    var t=trades[i];var td=new Date(t.date);
    if(td.getMonth()===month&&td.getFullYear()===year){
      if(!byDate[t.date])byDate[t.date]=0;
      byDate[t.date]+=t.pnl;monthPnl+=t.pnl;
    }
  }
  var firstDay=new Date(year,month,1).getDay();
  if(firstDay===0)firstDay=7;firstDay--;
  var daysInMonth=new Date(year,month+1,0).getDate();
  var days=["M","T","W","T","F","S","S"];
  var headers=days.map(function(d){return '<div style="text-align:center;font-size:9px;color:var(--text3);font-weight:600;padding:4px 0;letter-spacing:1px">'+d+'</div>';}).join('');
  var cells='';
  for(var i=0;i<firstDay;i++)cells+='<div></div>';
  var todayDate=now.getDate();
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=year+'-'+(month<9?'0':'')+(month+1)+'-'+(d<10?'0':'')+d;
    var pnl=byDate[dateStr];
    var cls="cal-day";
    var pnlHtml='';
    if(pnl!==undefined){
      cls+=" has-trade "+(pnl>=0?"profit":"loss");
      pnlHtml='<div class="cal-pnl" style="color:'+(pnl>=0?"var(--green)":"var(--red)")+'">'+fm(pnl)+'</div>';
    }
    if(d===todayDate)cls+=" today";
    cells+='<div class="'+cls+'"><div class="cal-dn">'+d+'</div>'+pnlHtml+'</div>';
  }
  // Best days
  var sortedDates=Object.entries(byDate).sort(function(a,b){return b[1]-a[1];}).slice(0,4);
  var bestDays=sortedDates.map(function(entry){
    var d=new Date(entry[0]);
    var dow=["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()];
    var max=Math.max.apply(null,Object.values(byDate));
    var pct=max>0?entry[1]/max*100:0;
    return '<div style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:5px">'+
      '<div style="font-size:12px;font-weight:600;color:var(--text)">'+dow+' '+d.getDate()+'</div>'+
      '<div style="font-size:13px;font-weight:700;color:var(--green);font-family:JetBrains Mono,monospace">'+fm(entry[1])+'</div>'+
      '</div>'+
      '<div class="mbar" style="height:4px">'+
      '<div class="mfill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--gold),var(--green))"></div></div></div>';
  }).join('');
  el("p3").innerHTML=
    '<div style="padding:16px 18px 8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
    '<div><div style="font-size:18px;font-weight:800;letter-spacing:1px">CALENDAR</div>'+
    '<div style="font-size:10px;color:var(--text3);letter-spacing:1px">'+months[month]+' '+year+'</div></div>'+
    '<div style="font-size:20px;font-weight:800;color:'+(monthPnl>=0?"var(--green)":"var(--red)")+';font-family:JetBrains Mono,monospace">'+fm(monthPnl)+'</div>'+
    '</div>'+
    '<div class="card">'+
    '<div class="cal-grid" style="grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px">'+headers+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '</div>'+
    (bestDays?'<div class="card"><div class="sec">Best Days &middot; '+months[month]+'</div>'+bestDays+'</div>':'')+
    '</div>';
}

      var bad=lg.fo||lg.rv||lg.ov||lg.br;
      return '<div class="card" style="border-left:2px solid '+(bad?"var(--red)":"var(--green)")+'">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px">'+
        '<span style="font-size:12px;font-weight:600;color:var(--text)">'+lg.date+'</span>'+
        '<span style="font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:5px;background:'+(bad?"rgba(229,57,53,0.1)":"rgba(76,175,80,0.1)")+';color:'+(bad?"var(--red)":"var(--green)")+'">'+( bad?"FLAGGED":"CLEAN")+'</span></div>'+
        '<div style="font-size:11px;color:var(--text3)">'+lg.before+' &#8594; '+lg.after+'</div>'+
        (lg.note?'<div style="font-size:11px;color:var(--text2);font-style:italic;margin-top:4px">"'+lg.note+'"</div>':'')+
        '</div>';
    }).join('')+'</div>';
}
function svPsych(){
  psych.unshift({id:Date.now(),date:el("pd").value,before:el("pb").value,after:el("pa").value,note:el("pn").value,fo:el("pfo").checked,rv:el("prv").checked,ov:el("pov").checked,br:el("pbr").checked});
  svPs();renderPsych();
}

// ── SETTINGS ──
function renderSettings(){
  var key=localStorage.getItem("te_apikey")||"";
  el("p10").innerHTML='<div style="padding:16px 18px 8px">'+
    '<div style="font-size:18px;font-weight:800;letter-spacing:1px;margin-bottom:14px">SETTINGS</div>'+
    '<div class="card card-gold">'+
    '<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px">AI Configuration</div>'+
    '<div style="font-size:11px;color:var(--text3);margin-bottom:14px;line-height:1.6">Your API key is stored only on this device. Never sent to GitHub or any server.</div>'+
    '<label style="margin-top:0">OpenRouter API Key</label>'+
    '<input type="password" id="aki" placeholder="sk-or-v1-..." style="margin-bottom:8px"/>'+
    '<div style="font-size:12px;margin-bottom:14px">Status: <b style="color:'+(key?"var(--green)":"var(--red)")+'">'+( key?"Connected: ..."+key.slice(-6):"Not configured")+'</b></div>'+
    '<button class="btn" onclick="svKey()">Save API Key</button>'+
    '<button class="btn btn-d" onclick="clKey()" style="margin-top:8px">Remove Key</button>'+
    '<div style="font-size:10px;color:var(--text3);margin-top:10px;text-align:center">Get a free key at openrouter.ai/keys</div></div>'+
    '<div class="card"><div class="sec">App Configuration</div>'+
    ['Version,TradeEdge v2.0','Instruments,MNQ / MGC + 17 contracts','Risk per trade,$120','Daily SL / TP,$360 / $540','Weekly SL / TP,$1,200 / $1,600'].map(function(r){
      var p=r.split(',');return '<div class="row"><span style="font-size:12px;color:var(--text3)">'+p[0]+'</span><span style="font-size:12px;color:var(--text);font-family:JetBrains Mono,monospace">'+p[1]+'</span></div>';
    }).join('')+'</div>'+
    '<div class="card" style="border-left:2px solid var(--red)">'+
    '<div style="font-size:11px;color:var(--red);font-weight:700;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">Danger Zone</div>'+
    '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">Permanently deletes all trades, notes and logs.</div>'+
    '<button class="btn btn-r" style="margin-top:0" onclick="rAll()">Reset All Data</button></div>'+
    '</div>';
}
function svKey(){var k=el("aki");if(!k||!k.value.trim())return;localStorage.setItem("te_apikey",k.value.trim());alert("API key saved!");renderSettings();}
function clKey(){localStorage.removeItem("te_apikey");renderSettings();}
function rAll(){if(!confirm("Delete ALL data? Cannot be undone."))return;localStorage.clear();trades=[];props=[];notes=[];psych=[];alert("All data cleared.");go(0);}

// ── NAVIGATION ──
function go(i){
  closeSB();
  document.querySelectorAll(".pg").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".sbi").forEach(function(b,idx){b.classList.toggle("on",idx===i);});
  ["nb0","nb1","nb2","nb4"].forEach(function(id){var e=el(id);if(e)e.classList.remove("on");});
  if(i===0)el("nb0").classList.add("on");
  if(i===1)el("nb1").classList.add("on");
  if(i===2)el("nb2").classList.add("on");
  if(i===4)el("nb4").classList.add("on");
  el("p"+i).classList.add("on");
  curP=i;
  var renders=[renderHome,renderTrades,renderJournal,renderCalendar,renderAI,renderCalc,renderRisk,renderProps,renderNotes,renderPsych,renderSettings];
  if(renders[i])renders[i]();
}

function toggleFS(){
  var e=document.documentElement,b=el("fsbtn"),isF=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isF){var r=e.requestFullscreen||e.webkitRequestFullscreen;if(r)r.call(e);if(b)b.textContent="X";}
  else{var x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);if(b)b.textContent="[]";}
}

window.onload=function(){
  try{renderHome();}
  catch(e){el("p0").innerHTML='<div style="color:var(--red);padding:20px;font-size:13px">Error: '+e.message+'</div>';}
};
</script>
</body></html>
